name: Hello GitHub Actions
on:
  push:
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello from GitHub Actions!"
      - name: Show Date
        run: date
      - name: Show Operating System
        run: uname -a
      - name: Show Python version
        run: python --version
      - name: Show git version
        run: git --version
      - name: get directory
        run: ls -la
